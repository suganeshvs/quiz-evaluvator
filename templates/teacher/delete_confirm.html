{% extends 'base.html' %}

{% block title %}Confirm Delete | AI Quiz Analyzer{% endblock %}

{% block content %}
<div class="py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="gc-card p-4 p-md-5 text-center">
                <div class="gc-brand-icon mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.6rem; background: var(--gc-danger-bg); color: var(--gc-danger);">
                    <i class="bi bi-exclamation-triangle"></i>
                </div>
                <h4 class="fw-bold text-dark mb-2">Confirm Erase</h4>
                <p class="text-secondary small mb-4">
                    Are you sure you want to erase <strong>{{ object_name }}</strong>? This action cannot be undone.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url cancel_url %}" class="btn-gc-secondary">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4 font-weight-medium" style="border-radius: var(--gc-radius-sm);">
                            <i class="bi bi-trash me-1"></i> Yes, Erase Now
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
