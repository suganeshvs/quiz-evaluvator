{% extends 'base.html' %}

{% block title %}Login | AI Quiz Analyzer{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 border-0 shadow">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-indigo-100 text-primary rounded-circle mb-3" style="width: 60px; height: 60px; background-color: #e0e7ff;">
                        <i class="bi bi-mortarboard-fill fs-2" style="color: #4f46e5;"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">AI Quiz Analyzer</h3>
                    <p class="text-muted small">Google Classroom Material Self-Assessment Platform</p>
                </div>

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" name="username" id="id_username" class="form-control border-start-0 ps-0" placeholder="Enter username" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" name="password" id="id_password" class="form-control border-start-0 ps-0" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-purple w-100 py-2.5 mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Log In
                    </button>
                </form>

                <hr class="my-4 text-muted">

                <div class="bg-light p-3 rounded-3 border">
                    <p class="fw-bold mb-2 small text-uppercase text-secondary tracking-wider"><i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Demo Accounts</p>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-outline-primary btn-sm flex-fill" onclick="fillDemo('teacher1', 'password123')">
                            <i class="bi bi-person-badge me-1"></i> Login as Teacher
                        </button>
                        <button type="button" class="btn btn-outline-purple btn-sm flex-fill" style="border-color: #7c3aed; color: #7c3aed;" onclick="fillDemo('student1', 'password123')">
                            <i class="bi bi-backpack me-1"></i> Login as Student
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function fillDemo(username, password) {
        document.getElementById('id_username').value = username;
        document.getElementById('id_password').value = password;
    }
</script>
{% endblock %}
